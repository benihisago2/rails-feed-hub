# Base house style: Rails Omakase. It already pulls in rubocop, rubocop-rails
# and rubocop-performance, so those are never listed as separate plugins.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

# rubocop-rspec 3.x is a first-class RuboCop plugin, so it is loaded through
# `plugins:` rather than the `require:` form, which is deprecated for extensions.
plugins:
  - rubocop-rspec

# Merge the Exclude arrays below with the ones inherited from RuboCop's own
# defaults and from omakase, instead of replacing them. Without this, listing
# AllCops/Exclude here would silently drop the built-in exclusions (.git, etc.).
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    # Generated by the schema dumper; not hand-written Ruby.
    - "db/schema.rb"
    # Migrations are Rails generator output (the Active Storage migration is
    # verbatim), and re-styling them buys nothing.
    - "db/migrate/*"
    # Rails binstubs are generated wrappers.
    - "bin/*"
    - "vendor/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"

# RSpec example groups legitimately exceed the generic block-length limit: a
# `describe` block is a whole file's worth of examples, not one method. This is
# the standard RSpec carve-out, applied to spec/ only, not a way to relax
# Metrics on application code.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# Likewise, individual examples are longer than application methods by nature
# (arrange / act / assert), so the RSpec-specific length limit is lifted for
# specs only.
RSpec/ExampleLength:
  Exclude:
    - "spec/**/*"

# One assertion per example is a purist default the real ecosystem does not
# follow: an example that fetches a feed and then checks both the created
# article and the updated feed status is testing one behaviour, and splitting
# it across two examples that repeat the same expensive setup makes the suite
# slower and less readable, not clearer. Five is a common, deliberate ceiling.
RSpec/MultipleExpectations:
  Max: 5
